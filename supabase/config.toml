project_id = "pupverse"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:4175"
additional_redirect_urls = ["http://localhost:4175", "http://127.0.0.1:5173"]
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[realtime]
enabled = true

[functions.arena]
verify_jwt = true

[functions.arena-cron]
verify_jwt = false

[functions.progression]
verify_jwt = true
